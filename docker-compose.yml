# Docker compose file that runs all the services in production

services:
  app-ml-train:
    build:
      context: .
      dockerfile: app-ml/Dockerfile
    command: python app-ml/entrypoint/train.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: "no"

  app-ml-inference-api:
    build:
      context: .
      dockerfile: app-ml/Dockerfile
    command: python app-ml/entrypoint/inference_api.py
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    depends_on:
      - app-ml-train

  app-ui:
    build:
      context: .
      dockerfile: app-ui/Dockerfile
    ports:
      - "8050:8050"
    environment:
      - INFERENCE_API_HOST=app-ml-inference-api
      - INFERENCE_API_PORT=5001
    volumes:
      - ./data:/app/data
    depends_on:
      - app-ml-inference-api
    restart: unless-stopped

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build:
      context: ./airflow
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "a-fixed-dev-secret-change-me"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db init && airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "a-fixed-dev-secret-change-me"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: ./airflow
    user: "0:0"
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "a-fixed-dev-secret-change-me"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ./common:/opt/airflow/project/common
      - ./config:/opt/airflow/project/config
      - ./data:/opt/airflow/project/data
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db-volume: